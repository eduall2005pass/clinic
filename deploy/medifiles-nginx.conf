# Add these location blocks inside the existing HTTPS server block for the
# media domain (medispark.duckdns.org). Files are stored on this VM at
# /var/www/medispark-uploads and served statically with Range support
# (required for audio seeking). Upload/delete requests are proxied to the
# local medifiles node service on 127.0.0.1:4021 — no extra open ports.

client_max_body_size 1g;

location /medifiles/ {
    alias /var/www/medispark-uploads/;
    autoindex off;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Access-Control-Allow-Origin "*";
}

location = /medifiles-upload {
    proxy_pass http://127.0.0.1:4021/upload;
    proxy_http_version 1.1;
    proxy_request_buffering off;
    client_max_body_size 1g;
    proxy_read_timeout 300s;
}

location = /medifiles-delete {
    proxy_pass http://127.0.0.1:4021/delete;
}
