name: Deploy to Interserver

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Next.js
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
        run: pnpm build

      - name: Package standalone deploy payload
        run: |
          set -euxo pipefail
          mkdir -p deploy-payload
          cp .next/standalone/server.js deploy-payload/standalone-server.js
          cp -r .next/standalone/.next deploy-payload/.next
          cp -r .next/static deploy-payload/.next/static
          cp -r public deploy-payload/public
          tar czf deploy.tar.gz -C deploy-payload .
          ls -lh deploy.tar.gz

      - name: Upload to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          source: deploy.tar.gz
          target: /tmp

      - name: Deploy + restart + verify
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          script: |
            set -euxo pipefail
            APP=/home/bloodare/domains/bloodarenabd.tech/app
            cd "$APP"
            cp -r .next .next-deploybak
            cp standalone-server.js standalone-server.js.deploybak
            rm -rf .next.new && mkdir .next.new
            tar xzf /tmp/deploy.tar.gz -C .next.new
            rm -rf .next.old && mv .next .next.old
            mv .next.new/.next .next
            cp .next.new/standalone-server.js standalone-server.js
            cp -r .next.new/public/. public/ 2>/dev/null || true
            rm -rf .next.new
            touch tmp/restart.txt
            sleep 8
            echo "=== BUILD_ID ==="
            cat .next/BUILD_ID
            echo "=== health ==="
            curl -s -o /dev/null -w 'home:%{http_code} ' https://bloodarenabd.tech/
            curl -s -o /dev/null -w 'login:%{http_code} ' https://bloodarenabd.tech/login
            curl -s -o /dev/null -w 'api/me:%{http_code}\n' https://bloodarenabd.tech/api/me
            rm -rf .next.old .next-deploybak standalone-server.js.deploybak
            rm -f /tmp/deploy.tar.gz