name: Sync to medisparkbd

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync clinic main into medisparkbd (same tree, fast-forward)
        env:
          TOKEN: ${{ secrets.MEDISPARKBD_TOKEN }}
        run: |
          set -e
          git config user.name "sync-bot"
          git config user.email "actions@users.noreply.github.com"
          MSBD="https://x-access-token:${TOKEN}@github.com/eduall2005pass/medisparkbd.git"
          MSBD_HEAD=$(git ls-remote "$MSBD" refs/heads/main | cut -f1)
          if [ -z "$MSBD_HEAD" ]; then
            echo "medisparkbd main not found"; exit 1
          fi
          TREE=$(git rev-parse HEAD^{tree})
          NEW=$(git commit-tree "$TREE" -p "$MSBD_HEAD" -m "Sync from clinic ${GITHUB_SHA::7}")
          git push "$MSBD" "$NEW:refs/heads/main"
